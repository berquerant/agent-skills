name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v5.2.10

      - name: Run shell lint
        run: mise run lint

      - name: Check skills
        run: mise run check-skills

      - name: Check skill publish
        run: mise run check-skill-publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run MCP lint
        run: mise run mcp:lint

  govulncheck:
    name: Govulncheck
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: berquerant/govulncheck-action@v1.0.4
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
          chdir: mcp

  actions-lock:
    name: Verify actions.lock
    permissions:
      contents: read
    uses: berquerant/reusable-workflows/.github/workflows/actions-lock-verify.yml@v0.10.1
