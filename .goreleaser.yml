version: 2

builds:
  - id: agent-skills-mcp
    dir: mcp
    main: ./cmd/agent-skills-mcp
    binary: agent-skills-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -v
      - -trimpath
    ldflags:
      - -s -w

archives:
  - formats: binary
    id: agent-skills-mcp

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  prerelease: auto
  use_existing_draft: true
